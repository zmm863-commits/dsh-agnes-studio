# 用 GitHub Actions + npm Trusted Publishing 发布（免 token、免 2FA 验证码）
#
# 触发：推 v* 标签（本机统一发布流水线正是 push tag），也可手动 dispatch
# 前置：在 npm 包页面 Access → Trusted Publisher 登记本仓库 + workflow 文件名 publish.yml
#
# 关键事实（2026-10-04 实测）：本仓库群**全部把 lib/ 写进 .gitignore**，
# 所以 CI 的干净检出里没有构建产物 —— **必须在 CI 里构建**，否则会发出空包。
# （唯一的例外是 dsh-sticky-notes：它的 lib/ 是历史上强制提交的，且没有 build 脚本，
#   `npm run build --if-present` 在它那里是空操作，直接发布已提交的 lib/。）
#
# 其余设计取舍：
#   · 构建后必须自检 lib/ 存在，缺了就**红**（宁可失败，也不发空包）。
#   · 发布后回查 registry，但窗口拉长、超时只报黄 —— npm 公开读路径实测滞后约 15 分钟，
#     只等 30 秒会把成功误判成失败（本工作流 v1 的毛病）。
#   · 顺手创建 GitHub Release（需要 contents: write）。

name: Publish to npm

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write   # 创建 GitHub Release
  id-token: write   # OIDC 换取临时发布凭据，必须有

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Upgrade npm (Trusted Publishing needs a recent CLI)
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm ci || npm install --legacy-peer-deps

      - name: Build (no-op for repos that commit their lib/)
        run: npm run build --if-present
        env:
          NPM_CONFIG_REGISTRY: https://registry.npmjs.org

      - name: Verify publishable files exist
        run: |
          node -e "
            const fs=require('fs'),p=require('./package.json');
            const need=(p.files||[]).filter(f=>f.startsWith('lib'));
            if(!need.length){console.log('files 未声明 lib，跳过');process.exit(0)}
            for(const f of need){
              // 注意：files 里可能是 glob（如 lib/*.d.ts），字面 existsSync 一定会失败 —— 取 '*' 之前的前缀探测
              const probe=f.includes('*')?f.slice(0,f.indexOf('*')):f;
              if(!fs.existsSync(probe)){console.error('❌ 缺少构建产物 '+f+'（探测路径 '+probe+'）');process.exit(1)}
            }
            console.log('✅ 发布物自检通过: '+need.join(', '));
          "

      - name: Publish (trusted publishing / OIDC)
        run: npm publish --provenance --access public
        env:
          NPM_CONFIG_REGISTRY: https://registry.npmjs.org

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            && echo "release $GITHUB_REF_NAME already exists" \
            || gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes

      - name: Verify on registry (long window, warn-only on timeout)
        run: |
          PKG=$(node -p "require('./package.json').name")
          VER=$(node -p "require('./package.json').version")
          for i in $(seq 1 12); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "https://registry.npmjs.org/$PKG/$VER?cb=$RANDOM")
            echo "attempt $i: $PKG@$VER -> HTTP $code"
            if [ "$code" = "200" ]; then echo "published and visible on registry"; exit 0; fi
            sleep 30
          done
          echo "::warning title=registry 尚未可见::$PKG@$VER 在 6 分钟后仍未出现在公开读取路径。npm 读路径实测可滞后十几分钟；也可能该版本被暂存待批准。请到 npm 包页面与 Staged Packages 复核。"
