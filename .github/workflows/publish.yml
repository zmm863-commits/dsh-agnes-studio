# 用 GitHub Actions + npm Trusted Publishing 发布（免 token、免 2FA 验证码）
#
# 触发：推 v* 标签（本机统一发布流水线正是 push tag）
# 前置：在 npm 包页面 Access → Trusted Publisher 登记本仓库 + workflow 文件名 publish.yml
#
# 三条设计取舍（都是踩坑换来的）：
#   1) CI 里**不装依赖、不重建**。发布物是仓库里已提交的 lib/，本地流水线负责构建并提交，
#      这样「npm 上的 tarball」与「tag 指向的提交」严格一致；CI 重建会引入未提交的差异。
#   2) 依赖安装尽力而为 —— 官方 @deepseek-ai/* 多为 rc 预发布版，解析失败不该连带发布失败。
#   3) 发布后**回查 registry 自证** —— 退出码 0 不等于发布成功（本机 2026-10-04 实测：
#      2FA 暂存发布会退出码 0 但 registry 上查不到）。

name: Publish to npm

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Upgrade npm (Trusted Publishing needs a recent CLI)
        run: npm install -g npm@latest

      - name: Install dependencies (best effort)
        run: npm ci || npm install --legacy-peer-deps || echo "::warning::dependency install failed, continuing"

      - name: Verify publishable files are committed
        run: |
          node -e "const fs=require('fs');const p=require('./package.json');const need=(p.files||[]).filter(f=>f.startsWith('lib'));if(!need.length){console.log('files does not declare lib/, skip');process.exit(0)}for(const f of need){if(!fs.existsSync(f)){console.error('missing build output: '+f);process.exit(1)}}console.log('publishable files OK: '+need.join(', '))"

      - name: Publish
        run: npm publish --provenance --access public
        env:
          NPM_CONFIG_REGISTRY: https://registry.npmjs.org

      - name: Verify on registry
        run: |
          PKG=$(node -p "require('./package.json').name")
          VER=$(node -p "require('./package.json').version")
          for i in 1 2 3 4 5; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "https://registry.npmjs.org/$PKG/$VER?cb=$RANDOM")
            echo "attempt $i: $PKG@$VER -> HTTP $code"
            if [ "$code" = "200" ]; then exit 0; fi
            sleep 6
          done
          echo "version not found on registry after 5 attempts"; exit 1
